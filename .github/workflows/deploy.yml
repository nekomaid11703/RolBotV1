name: Deploy to Oracle Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.lint.outcome }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        id: lint
        run: npm run lint

      - name: TypeCheck
        run: npm run typecheck

      - name: Tests
        run: npm run test:vite

      - name: DepCruise
        run: npm run depcruise

  deploy:
    name: Deploy to Oracle VM
    needs: quality
    if: needs.quality.outputs.status == 'success'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.SSH_PORT }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Rsync code to VM
        run: |
          rsync -avz --delete \
            -e "ssh -p ${{ secrets.SSH_PORT }}" \
            --exclude 'node_modules' \
            --exclude '.env' \
            --exclude '.env.local' \
            --exclude '.env.production' \
            --exclude '.git' \
            --exclude 'graphify-out' \
            --exclude 'tests' \
            --exclude 'logs' \
            --exclude 'bugs' \
            --exclude 'temp' \
            --exclude '*.log' \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.REMOTE_DIR || '/opt/rolbot' }}/

      - name: Install dependencies
        run: |
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "cd ${{ secrets.REMOTE_DIR || '/opt/rolbot' }} && npm ci"

      - name: Restart bot
        run: |
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "cd ${{ secrets.REMOTE_DIR || '/opt/rolbot' }} && pm2 start ecosystem.config.js --update-env || pm2 restart rolbot --update-env && pm2 save"

      - name: Verify deployment
        run: |
          sleep 5
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "pm2 status && pm2 logs rolbot --lines 10 --nostream"
